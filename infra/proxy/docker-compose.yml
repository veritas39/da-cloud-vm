name: da-cloud-proxy

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    # .env is strictly required; Docker Compose will refuse to start if missing
    env_file:
      - path: .env
        required: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
    name: da-cloud_caddy_data
  caddy_config:
    name: da-cloud_caddy_config

networks:
  proxy-net:
    name: proxy-net
    external: true
